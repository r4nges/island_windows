name: build-windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # tag v1.2.3 precisa bater com a versão do tauri.conf.json, senão o
      # latest.json anunciaria uma versão diferente da instalada
      - name: Conferir versão da tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $ver = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ("v$ver" -ne $env:GITHUB_REF_NAME) { throw "tag $env:GITHUB_REF_NAME não bate com a versão $ver do tauri.conf.json" }

      - run: npm install

      # Com a chave, o Tauri assina o instalador e gera o .sig do updater.
      # Sem ela (PR de fork), compila sem os artefatos do updater.
      - name: Build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ($env:TAURI_SIGNING_PRIVATE_KEY) {
            npx tauri build
          } else {
            Write-Host "::warning::Sem TAURI_SIGNING_PRIVATE_KEY: build sem artefatos do updater"
            '{"bundle":{"createUpdaterArtifacts":false}}' | Set-Content "$env:RUNNER_TEMP/nosign.json"
            npx tauri build --config "$env:RUNNER_TEMP/nosign.json"
          }
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: island-installer
          path: src-tauri/target/release/bundle/nsis/*.exe

      # latest.json: o que o app instalado consulta em
      # releases/latest/download/latest.json para saber se há versão nova
      - name: Gerar latest.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $dir = "src-tauri/target/release/bundle/nsis"
          $ver = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $exe = Get-Item "$dir/*_x64-setup.exe"
          $sig = (Get-Content -Raw "$($exe.FullName).sig").Trim()
          $url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:GITHUB_REF_NAME/$($exe.Name)"
          [ordered]@{
            version   = $ver
            notes     = "Novidades: https://github.com/$env:GITHUB_REPOSITORY/releases/tag/$env:GITHUB_REF_NAME"
            pub_date  = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = @{ "windows-x86_64" = @{ signature = $sig; url = $url } }
          } | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8NoBOM "$dir/latest.json"
          Get-Content "$dir/latest.json"

      - name: Release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/nsis/*_x64-setup.exe
            src-tauri/target/release/bundle/nsis/*_x64-setup.exe.sig
            src-tauri/target/release/bundle/nsis/latest.json
